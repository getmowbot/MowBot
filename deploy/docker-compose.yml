# Production stack. Usage: cp deploy/.env.example deploy/.env, fill it, then
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: mowbot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mowbot
      POSTGRES_USER: mowbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mowbot -d mowbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Restricted Docker API for the hub (it will create the bots' computers from P1 on).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
    image: mowbot/hub:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mowbot:${POSTGRES_PASSWORD}@postgres:5432/mowbot
      MOWBOT_MASTER_KEY: ${MOWBOT_MASTER_KEY:?Set MOWBOT_MASTER_KEY in deploy/.env}
      MOWBOT_SETUP_TOKEN: ${MOWBOT_SETUP_TOKEN:-}
      MOWBOT_TRUST_PROXY: "true"
      # false only when serving plain HTTP on a LAN (see deploy/.env.example).
      MOWBOT_COOKIE_SECURE: ${MOWBOT_COOKIE_SECURE:-true}
      DOCKER_HOST: tcp://socket-proxy:2375
      MOWBOT_WORKSPACES_DIR: /data/workspaces
      MOWBOT_WORKSPACES_VOLUME: mowbot-workspaces
      MOWBOT_WORKSTATION_IMAGE: ${MOWBOT_WORKSTATION_IMAGE:-mowbot/workstation:local}
      MOWBOT_MCP_IMAGE: ${MOWBOT_MCP_IMAGE:-mowbot/mcp:local}
      MOWBOT_COMPUTER_NETWORK: mowbot-computers
      MOWBOT_COMPUTER_REACH: dns
      MOWBOT_COMPUTER_RUNTIME: ${MOWBOT_COMPUTER_RUNTIME:-}
      MOWBOT_COMPUTER_IDLE_MINUTES: ${MOWBOT_COMPUTER_IDLE_MINUTES:-30}
      MOWBOT_WHISPER_MODEL: ${MOWBOT_WHISPER_MODEL:-onnx-community/whisper-base}
      MOWBOT_WHISPER_LANGUAGE: ${MOWBOT_WHISPER_LANGUAGE:-}
      # The bots' web previews: the hub listens on these ports, Caddy publishes them.
      MOWBOT_PREVIEW_PORTS: ${MOWBOT_PREVIEW_PORTS:-8800-8819}
      MOWBOT_PUBLIC_URL: ${MOWBOT_PUBLIC_URL:-}
    volumes:
      - workspaces:/data/workspaces
      # Whisper, downloaded at the first voice message.
      - models:/data/models
    networks: [internal, computers]

  # Image of the computers the hub starts (not a running service).
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile build build
  workstation:
    build:
      context: ..
      dockerfile: workstation/Dockerfile
    image: ${MOWBOT_WORKSTATION_IMAGE:-mowbot/workstation:local}
    profiles: [build]

  # Image of the MCP computer, where the MCP servers run (no desktop; not a running service).
  mcp:
    build:
      context: ..
      dockerfile: workstation/mcp.Dockerfile
    image: ${MOWBOT_MCP_IMAGE:-mowbot/mcp:local}
    profiles: [build]

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    image: mowbot/caddy:local
    restart: unless-stopped
    depends_on: [hub]
    environment:
      MOWBOT_DOMAIN: ${MOWBOT_DOMAIN:-localhost}
      MOWBOT_PREVIEW_PORTS: ${MOWBOT_PREVIEW_PORTS:-8800-8819}
    ports:
      - "${MOWBOT_HTTP_PORT:-80}:80"
      - "${MOWBOT_HTTPS_PORT:-443}:443"
      - "${MOWBOT_HTTPS_PORT:-443}:443/udp"
      # The bots' web previews (same address as the app, one port each), HTTP/3 included.
      - "${MOWBOT_PREVIEW_PORTS:-8800-8819}:${MOWBOT_PREVIEW_PORTS:-8800-8819}"
      - "${MOWBOT_PREVIEW_PORTS:-8800-8819}:${MOWBOT_PREVIEW_PORTS:-8800-8819}/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  models:
  # Fixed name: the hub mounts one sub-folder per workspace into each computer.
  workspaces:
    name: mowbot-workspaces

networks:
  internal:
  # Shared by the hub and the computers it creates (fixed name, referenced by the hub).
  computers:
    name: mowbot-computers
