# Production stack. Usage: cp deploy/.env.example deploy/.env, fill it, then
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: mowbot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mowbot
      POSTGRES_USER: mowbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mowbot -d mowbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Restricted Docker API for the hub (it will create the bots' computers from P1 on).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
    image: mowbot/hub:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mowbot:${POSTGRES_PASSWORD}@postgres:5432/mowbot
      MOWBOT_MASTER_KEY: ${MOWBOT_MASTER_KEY:?Set MOWBOT_MASTER_KEY in deploy/.env}
      MOWBOT_SETUP_TOKEN: ${MOWBOT_SETUP_TOKEN:-}
      MOWBOT_TRUST_PROXY: "true"
      DOCKER_HOST: tcp://socket-proxy:2375
    networks: [internal]

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    image: mowbot/caddy:local
    restart: unless-stopped
    depends_on: [hub]
    environment:
      MOWBOT_DOMAIN: ${MOWBOT_DOMAIN:-localhost}
    ports:
      - "${MOWBOT_HTTP_PORT:-80}:80"
      - "${MOWBOT_HTTPS_PORT:-443}:443"
      - "${MOWBOT_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
