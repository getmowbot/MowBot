<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MowBot</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <!-- The window has no frame: this band moves it, with the window's buttons on the right. -->
    <div class="titlebar" data-tauri-drag-region>
      <button id="win-minimize" type="button" class="win" aria-label="Réduire">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button id="win-maximize" type="button" class="win" aria-label="Agrandir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
      </button>
      <button id="win-close" type="button" class="win close" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <main class="card">
      <img class="logo" src="logo.svg" alt="" width="64" height="64" />
      <h1 data-i18n="title">Bienvenue sur MowBot</h1>
      <p class="lead" data-i18n="lead">Indique l'adresse de ton hub MowBot.</p>
      <form id="form" novalidate>
        <label for="url" data-i18n="label">Adresse du hub</label>
        <input
          id="url"
          name="url"
          type="url"
          inputmode="url"
          autocomplete="url"
          spellcheck="false"
          placeholder="https://mowbot.exemple.com"
          required
        />
        <p id="error" class="error" role="alert" hidden></p>
        <button id="submit" type="submit" data-i18n="submit">Continuer</button>
        <button id="cancel" type="button" class="ghost" hidden data-i18n="cancel">
          Revenir au hub actuel
        </button>
      </form>
      <p class="hint" data-i18n="hint">En local : http://localhost:5173</p>
    </main>
  </body>
</html>
