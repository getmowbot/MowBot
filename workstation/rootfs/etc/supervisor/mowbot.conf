; Processes of a MowBot computer. Everything but supervisord runs as `bot`.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Only reachable from inside the container: mow-agent bridges it to the hub.
[program:xvnc]
command=/usr/bin/Xvnc :0 -geometry 1280x800 -depth 24 -rfbport 5900 -localhost -SecurityTypes None -AlwaysShared -desktop MowBot
user=bot
environment=HOME="/home/bot",USER="bot"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop]
command=/usr/local/bin/mowbot-desktop
user=bot
environment=HOME="/home/bot",USER="bot",DISPLAY=":0"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Shared browser of the computer. Closing it on purpose (exit 0) does not respawn it.
[program:chrome]
command=/usr/local/bin/mowbot-chrome
user=bot
environment=HOME="/home/bot",USER="bot",DISPLAY=":0"
priority=30
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=/usr/local/bin/node /opt/mowbot/agent.cjs
user=bot
directory=/workspace
environment=HOME="/home/bot",USER="bot",DISPLAY=":0"
priority=5
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
