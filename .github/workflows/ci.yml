name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: shellcheck install.sh apps/desktop/install-linux.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI client is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- packages/api-client

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/hub/Dockerfile -t mowbot/hub:ci .
      - run: docker build -f deploy/Caddy.Dockerfile -t mowbot/caddy:ci .
      - run: docker build -f workstation/Dockerfile -t mowbot/workstation:ci .
      - name: Workstation boots its desktop and agent
        run: |
          docker run -d --name pc -e MOWBOT_AGENT_TOKEN=ci-token --shm-size=1g -p 127.0.0.1:7070:7070 mowbot/workstation:ci
          for i in $(seq 1 60); do
            if curl -fsS -H 'authorization: Bearer ci-token' http://127.0.0.1:7070/health | tee /tmp/health | grep -q '"vnc":true'; then
              cat /tmp/health; exit 0
            fi
            sleep 2
          done
          docker logs pc
          exit 1
      - run: docker build -f workstation/mcp.Dockerfile -t mowbot/mcp:ci .
      - name: MCP computer runs its agent and the servers' tools
        run: |
          docker run -d --name mcp -e MOWBOT_AGENT_TOKEN=ci-token -p 127.0.0.1:7071:7070 mowbot/mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS -H 'authorization: Bearer ci-token' http://127.0.0.1:7071/health; then
              curl -fsS -H 'authorization: Bearer ci-token' -H 'content-type: application/json' \
                -d '{"command":"node --version && npx --version && python3 --version && pipx --version && uvx --version && git --version"}' \
                http://127.0.0.1:7071/exec | tee /tmp/exec | jq -e '.exitCode == 0'
              exit $?
            fi
            sleep 2
          done
          docker logs mcp
          exit 1
