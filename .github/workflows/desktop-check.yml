name: Desktop check

# The desktop app has code for each OS (macOS traffic lights, Windows process flags…): check it
# compiles and passes its tests on all three before merging.
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-check.yml'

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux libraries (WebKitGTK, tray, Secret Service)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
