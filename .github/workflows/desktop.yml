name: Desktop app

# Builds the installers of the desktop app (Windows .exe/.msi, macOS .dmg, Linux AppImage/.deb/.rpm)
# and publishes them as the GitHub release `desktop-v<version>` (version from tauri.conf.json):
# on every merge into main that changes the app, on a `desktop-v*` tag, or by hand. A new version
# number makes a new release; the same one replaces its installers.
#
# A new release stays a draft until every platform is built: the installed apps read latest.json
# from the latest published release, which would otherwise miss the platforms still building.
# Its notes are the version's section of CHANGELOG.md (new notes for a published version: run
# the workflow by hand). Changes waiting for the next version go under "Unreleased".
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
    tags: ['desktop-v*']
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version: add '## $version — <date>' with its notes."
            exit 1
          fi
          cat >> notes.md <<EOF

          ### Install
          - **Windows:** \`MowBot_${version}_x64-setup.exe\` (or the \`.msi\`)
          - **macOS:** \`MowBot_${version}_universal.dmg\`
          - **Linux:** the AppImage, \`.deb\` or \`.rpm\`, or one command: see [the README](https://github.com/getmowbot/MowBot#desktop-app)

          On first launch, enter your hub's address (the web app's). Installed apps update themselves.
          Update a server with \`sudo mowbot update\` to get the hub's side of these changes.
          EOF
      - name: Draft release (or the existing one)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          tag="desktop-v$VERSION"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@notes.md > /dev/null
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="MowBot desktop $VERSION" \
              -F body=@notes.md \
              -F draft=true \
              -q .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux libraries (WebKitGTK, tray, Secret Service)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: pnpm install --frozen-lockfile --filter @mowbot/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app checks them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
          # latest.json: what the installed apps read to update themselves.
          includeUpdaterJson: true

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release, now complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true > /dev/null
